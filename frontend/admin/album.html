<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Album — dukhaansin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=9">
</head>
<body>
  <div class="admin-topbar">
    <div style="display:flex; align-items:center; gap:1rem;">
      <a href="/admin" class="back-link">&larr; Back</a>
      <h1 id="page-title">Manage Album</h1>
    </div>
    <a href="#" class="btn btn-outline btn-small" id="view-public-link">View Public</a>
  </div>

  <main class="container">
    <!-- Album Settings -->
    <div class="admin-section">
      <h2>Album Settings</h2>
      <form id="settings-form">
        <div class="form-group">
          <label for="edit-title">Title</label>
          <input type="text" id="edit-title" name="title" required>
        </div>
        <div class="form-group">
          <label for="edit-desc">Description</label>
          <input type="text" id="edit-desc" name="description">
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </form>
    </div>

    <!-- Upload -->
    <div class="admin-section">
      <h2>Upload Photos</h2>
      <div class="upload-zone" id="upload-zone">
        <p>Drag & drop images here, or click to browse</p>
        <input type="file" id="file-input" multiple accept="image/*" style="display:none;">
      </div>
      <div class="upload-progress" id="upload-progress" style="display:none;">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <p id="progress-text">Uploading...</p>
      </div>
    </div>

    <!-- Photos Grid -->
    <div class="admin-section">
      <h2>Photos <span class="photo-count" id="photo-count"></span></h2>
      <div class="preview-grid" id="preview-grid">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </main>

  <script src="/js/admin.js?v=9"></script>
</body>
</html>
