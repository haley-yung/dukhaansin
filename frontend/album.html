<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album — dukhaansin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">dukhaansin</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/admin">Admin</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="album-header" id="album-header">
      <a href="/" class="back-link">&larr; Back</a>
      <h1 class="album-title" id="album-title">Loading...</h1>
      <p class="album-description" id="album-description"></p>
    </div>

    <div class="masonry" id="masonry-grid">
      <div class="loading-spinner"></div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <button class="lightbox-prev" id="lightbox-prev">&#8249;</button>
    <button class="lightbox-next" id="lightbox-next">&#8250;</button>
    <img class="lightbox-img" id="lightbox-img" alt="">
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 dukhaansin</p>
  </footer>

  <script src="/js/gallery.js"></script>
</body>
</html>
