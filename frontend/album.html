<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album — dukhaansin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=13">
</head>
<body class="public">
  <nav class="top-nav">
    <a href="/" class="wordmark">dukhaansin</a>
    <div class="top-nav-links">
      <a href="/app">Apps</a>
      <a href="/admin">Admin</a>
    </div>
  </nav>

  <header class="album-masthead">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Index
    </a>
    <h1 class="album-title" id="album-title">Loading</h1>
    <p class="album-description" id="album-description"></p>
    <div class="album-meta mono" id="album-meta"></div>
  </header>

  <main>
    <div class="grid-gallery" id="grid-gallery">
      <div class="archive-loading">Loading</div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <button class="lightbox-prev" id="lightbox-prev" aria-label="Previous">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="lightbox-next" id="lightbox-next" aria-label="Next">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <img class="lightbox-img" id="lightbox-img" alt="">
    <div class="lightbox-counter mono" id="lightbox-counter"></div>
  </div>

  <footer class="site-foot">
    <span class="mono">dukhaansin.com</span>
    <span class="foot-sep">·</span>
    <span>A quiet place for photographs.</span>
  </footer>

  <script src="/js/gallery.js?v=13"></script>
</body>
</html>
