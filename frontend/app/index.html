<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apps — dukhaansin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0A0A0B;
      --heading: #FAFAF7;
      --text: #F2F2F0;
      --secondary: #A6A6AB;
      --muted: #6F6F76;
      --line: rgba(255,255,255,0.06);
      --line-hi: rgba(255,255,255,0.12);
      --surface: rgba(255,255,255,0.025);
      --surface-hi: rgba(255,255,255,0.045);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); }
    body {
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: pageIn 520ms ease 80ms forwards;
    }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes rowIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      body, .row { animation: none !important; }
    }

    .wrap {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 80px 24px 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--heading);
      animation: pulse 2.6s ease-in-out infinite;
    }

    h1 {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: clamp(38px, 6vw, 56px);
      font-weight: 300;
      letter-spacing: -0.022em;
      color: var(--heading);
      line-height: 1.05;
      margin-bottom: 14px;
    }
    .lede {
      font-size: 15.5px;
      color: var(--secondary);
      max-width: 480px;
      line-height: 1.5;
      letter-spacing: -0.005em;
      margin-bottom: 56px;
    }

    .apps {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-top: 1px solid var(--line);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 28px 4px;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      transition: padding 240ms ease, color 200ms ease;
      position: relative;
      opacity: 0;
      animation: rowIn 520ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .row:nth-child(1) { animation-delay: 160ms; }
    .row:nth-child(2) { animation-delay: 240ms; }
    .row:hover { padding-left: 10px; }
    .row:hover .arrow { transform: translateX(4px); opacity: 1; }

    .num {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
      flex-shrink: 0;
      min-width: 28px;
    }

    .meta { flex: 1; min-width: 0; }
    .title {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.015em;
      color: var(--heading);
      margin-bottom: 4px;
    }
    .desc {
      font-size: 13.5px;
      color: var(--secondary);
      letter-spacing: -0.005em;
      line-height: 1.45;
    }

    .arrow {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--muted);
      opacity: 0.6;
      transition: transform 220ms ease, opacity 220ms ease;
    }

    /* Stack into single column when tight */
    @media (max-width: 720px) {
      .wrap { padding: 56px 20px 32px; }
      .apps { grid-template-columns: 1fr; }
      .row { padding: 22px 4px; }
      .title { font-size: 19px; }
    }

    footer {
      padding: 20px 24px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 920px;
      margin: 0 auto;
      width: 100%;
    }
    footer a {
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: -0.005em;
      transition: color 180ms ease;
    }
    footer a:hover { color: var(--text); }
    footer .brand {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <span class="eyebrow"><span class="dot"></span>Apps</span>
    <h1>A quiet suite.</h1>
    <p class="lede">Two small tools that show up every day — for training, and for debt. Built the way I want to use them.</p>

    <nav class="apps" aria-label="Applications">
      <a href="/app/gym" class="row">
        <span class="num">01</span>
        <div class="meta">
          <div class="title">Gym Tracker</div>
          <div class="desc">Train with intention. Log the work, not the noise.</div>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 5l7 7-7 7"/>
        </svg>
      </a>
      <a href="/app/debt" class="row">
        <span class="num">02</span>
        <div class="meta">
          <div class="title">Debt Tracker</div>
          <div class="desc">Every payment, every month — until the balance is zero.</div>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 5l7 7-7 7"/>
        </svg>
      </a>
    </nav>
  </main>

  <footer>
    <span class="brand">dukhaansin.com</span>
    <a href="/">&larr; Back to gallery</a>
  </footer>
</body>
</html>
