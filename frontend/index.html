<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dukhaansin — Gallery of Memories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">dukhaansin</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/admin">Admin</a>
      </div>
    </div>
  </nav>

  <section class="hero">
    <h1 class="hero-title">Gallery of Memories</h1>
    <p class="hero-subtitle">The Collection</p>
  </section>

  <main class="container">
    <div class="albums-grid" id="albums-grid">
      <p class="loading-text">Loading albums...</p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 dukhaansin</p>
  </footer>

  <script>
    (async () => {
      const grid = document.getElementById('albums-grid');
      try {
        const res = await fetch('/api/albums');
        const albums = await res.json();

        if (!albums.length) {
          grid.innerHTML = '<p class="empty-state">No albums yet.</p>';
          return;
        }

        grid.innerHTML = albums.map(album => `
          <a href="/album/${album.slug}" class="album-card">
            <div class="album-card-img">
              ${album.coverUrl
                ? `<img src="${album.coverUrl}" alt="${album.title}" loading="lazy">`
                : '<div class="album-card-placeholder"></div>'}
            </div>
            <div class="album-card-info">
              <h3 class="album-card-title">${album.title}</h3>
              <span class="album-card-count">${album.photoCount} photo${album.photoCount !== 1 ? 's' : ''}</span>
            </div>
          </a>`).join('');
      } catch (err) {
        grid.innerHTML = '<p class="empty-state">Failed to load albums.</p>';
      }
    })();
  </script>
</body>
</html>
